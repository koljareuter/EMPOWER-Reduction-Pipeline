# EMPOWER reduction of KMOS IZ, YJ and H data, full chain from raw frames to sky-subtracted,
# illumination- and background-corrected, barycentric-corrected cubes, with the same settings for every band.
#
#   python scripts/reduce_kmos.py -p examples/empower.cfg
# then combination (EDPS cubes_combination) and telluric correction of the combined cubes
# (scripts/make_edps_input.py, scripts/telluric_combined.py), see README.
#
# Run it from an empty working directory: esorex writes temporary .sof files and logs there.
# Needs esorex with the KMOS 4.5.11 recipes and $KMOS_CALIB pointing at the KMOS 4.5.11 static calibrations.
#
# EMPOWER settings:
#   - row common-mode correction of detectors 2 and 3
#   - new IZ OH reference spectrum, linear OH wavelength correction (patched DRP, drp_patch/)
#   - ZAPv2 sky subtraction with the mean-free IZ and H eigenbases shipped in pyspark/data (YJ: bundled basis)
#   - hybrid sky subtraction for OBJECT frames whose SKY frame is > 20 deg away in rotator angle, with the
#     slitlet-position model (pos3/ifumed), the OH-line-wing term and the slitlet-end term
#   - barycentric correction by resampling, telluric correction as a separate step

[instrument]
obsband = IZ,YJ,H

[pathing]
# rawdir/<subdir> holds the raw frames of one OB (science, sky, darks, flats, arcs, standard);
# results go to procdir/<subdir>. One subdir per line.
rawdir  = /path/to/kmos_raw
procdir = /path/to/kmos_proc
subdirs = KMOS.2026-01-15T01:00:33.152
          KMOS.2026-01-12T05:36:55.243
          KMOS.2026-06-07T07:24:38.627

[detector]
channel_correct = True
picture_correct = True
interchannel_correct = False
# the detector step writes dc_ frames, the row common-mode step turns them into dcr_ frames
prefix = dcr
row_commonmode_correct = True
row_commonmode_input = dc
row_commonmode_dets = 2,3
row_commonmode_grow = 1
row_commonmode_minpix = 150

[calibration]
# the calibration steps depend on each other, run all of them for a new OB
make_dark = True
make_flat = True
make_arc = True
make_illum = True
reconstruct_arc = True
make_standard = True
darkexp = 300
# kmos_flat options (default -cmethod=ksigma -badpix_thresh=10). For the IZ OBs of the nights 2026-01-13, 01-14,
# 02-10, 02-11, 02-12, 02-13 and 02-14 the default makes kmos_flat reject detector 3 as "strongly vignetted",
# and IFUs 18-24 end up empty. The EMPOWER reduction used this setting for those nights only:
#flat_args = -cmethod=ksigma -badpix_thresh=35

[cubes]
reconstruct_cubes = True
sky_method = zapv2
# mean-free eigenbases in this repository (absolute paths); YJ has no entry and uses the bundled basis
svd_path_iz = /path/to/EMPOWER-Reduction-Pipeline/pyspark/data/ZAPv2_SVD_IZ_n500004_nomean.fits
svd_path_h  = /path/to/EMPOWER-Reduction-Pipeline/pyspark/data/ZAPv2_SVD_H_n500004_nomean.fits
rvcorr = True
# barycentric correction by resampling every spaxel (telluric_combined.py expects this)
rv_mode = interp
use_oh = True
# OH reference spectrum for the wavelength correction of kmos_sci_red. The standard kmos_oh_spec_iz.fits of
# KMOS 4.5.11 has only 10 usable lines at 0.98-1.09 um, so the correction is extrapolated badly below 0.9 um.
# The EMPOWER file has 27 usable lines down to 0.835 um. YJ and H use $KMOS_CALIB/kmos_oh_spec_<band>.fits.
oh_spec_iz = /path/to/EMPOWER-Reduction-Pipeline/pyspark/data/kmos_oh_spec_iz_NEW.fits
# linear instead of quadratic OH wavelength correction; needs the patched KMOS 4.5.11 recipes from drp_patch/
# (see README). Both lines belong together; without the patched recipes comment out both.
recipe_dir = /path/to/KMOS_4.5.11_lcorr/install/lib/esopipes-plugins
lcorr_degree = 1
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
hybrid_sky = True
# detector-level O - S for every OBJECT frame whose SKY frame lies in another calibration bin
# (hybrid_min_dangle is no longer used)
hybrid_bands = IZ,YJ,H
# IFU-wide median of the sky-only term in the OH-line wings (2-3 planes from a line core)
hybrid_wing = 3
# slitlet-end level of the sky-only term at the 3 end positions of every slitlet, smoothed along wavelength
# (removes the hot edge rows the hybrid otherwise adds)
hybrid_edge = 3
# exact IFU median of the sky-only term outside the OH cores; in the OH cores the slitlet median plus the
# position profile along the slitlet at the 3 end positions
hybrid_free_model = ifumed
hybrid_oh_model = pos3
# high-pass the OH-core term like the rest of the model, so a broad slitlet offset of the sky-only term is not put
# back in the OH-core planes only. Without it the outermost slitlet of IFU 24 jumps by up to +-2.5 ADU/s between
# planes at 0.96-0.99 um on the nights 2026-02-12/13 ('blocks' in the combined cubes); with it the jump is 0.1 ADU/s
# and all other rows change by < 0.001 ADU/s (KMOS.2026-02-12T01:48:34.134, 6 frames, median/tmpl)
hybrid_oh_highpass = True
