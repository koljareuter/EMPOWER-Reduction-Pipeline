# Test of [cubes] hybrid_oh_highpass, baseline (option off). Same as test_ohhp_on.cfg except procdir and the
# option. Sky subtraction and the later steps only, on top of the PROCDIR_HYB cubes of two h21.4 IZ OBs whose
# arm 24 holds COSMOS 1147707 (all 12 OBJECT frames hybrid, SKY ~90 deg away). Prepare the procdir first:
#   python scripts/prepare_hybrid_test.py /local_storage/KOLJA/PROCDIR_HYB /local_storage/KOLJA/PROCDIR_OHHP_OFF \
#          KMOS.2026-02-10T02:57:00.698 KMOS.2026-02-10T03:49:09.239 --band IZ
# reconstruct_cubes = False and all detector/calibration steps off are required: calib/ and sky/ are links.

[instrument]
obsband = IZ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /local_storage/KOLJA/PROCDIR_OHHP_OFF
subdirs = KMOS.2026-02-10T02:57:00.698
          KMOS.2026-02-10T03:49:09.239

[detector]
channel_correct = False
picture_correct = False
interchannel_correct = False
prefix = dcr
row_commonmode_correct = False

[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
reconstruct_cubes = False
sky_method = zapv2
svd_path_iz = /home/kreuter/EMPOWER-Reduction-Pipeline/pyspark/data/ZAPv2_SVD_IZ_n500004_nomean.fits
rvcorr = True
rv_mode = interp
use_oh = True
oh_spec_iz = /local_storage/EMPOWER_raw_data/input_all/static/kmos_oh_spec_iz_NEW.fits
recipe_dir = /home/kreuter/KMOS_PIPELINE_4.5.11_lcorr/install/lib/esopipes-plugins
lcorr_degree = 1
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
hybrid_sky = True
hybrid_bands = IZ,YJ,H
hybrid_wing = 3
hybrid_edge = 3
hybrid_free_model = ifumed
hybrid_oh_model = pos3
hybrid_oh_highpass = False
