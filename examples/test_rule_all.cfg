# Test of [cubes] hybrid_rule = all (detector-level O - S for every OBJECT frame) against the clean run
# (PROCDIR_CLEAN, hybrid_rule = bins). Two IZ OBs: cdfs_targets_2 (SKY in the same bin, rotator matched) and
# cosmos_target_legac (SKY 37 deg away, same bin: classic O - S in the clean run). From the reconstruction on,
# with the detector-corrected frames and calib/ of PROCDIR_CLEAN. Prepare first:
#   python scripts/prepare_rule_test.py /local_storage/KOLJA/PROCDIR_CLEAN /local_storage/KOLJA/PROCDIR_RULEALL #          KMOS.2026-01-13T02:54:58.606 KMOS.2026-01-14T05:23:13.608 --band IZ --prefix dcr
# All detector and calibration steps off: the frames / calib come from PROCDIR_CLEAN. Otherwise the [cubes]
# settings of clean_run/empower_clean_IZdet3.cfg.

[instrument]
obsband = IZ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /local_storage/KOLJA/PROCDIR_RULEALL
subdirs = KMOS.2026-01-13T02:54:58.606
          KMOS.2026-01-14T05:23:13.608

[detector]
channel_correct = False
picture_correct = False
interchannel_correct = False
prefix = dcr
row_commonmode_correct = False

[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
reconstruct_cubes = True
sky_method = zapv2
svd_path_iz = /home/kreuter/EMPOWER-Reduction-Pipeline/pyspark/data/ZAPv2_SVD_IZ_n500004_nomean.fits
rvcorr = True
rv_mode = interp
use_oh = True
oh_spec_iz = /home/kreuter/EMPOWER-Reduction-Pipeline/pyspark/data/kmos_oh_spec_iz_NEW.fits
recipe_dir = /home/kreuter/KMOS_PIPELINE_4.5.11_lcorr/install/lib/esopipes-plugins
lcorr_degree = 1
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
hybrid_sky = True
hybrid_bands = IZ,YJ,H
hybrid_rule = all
hybrid_wing = 3
hybrid_edge = 3
hybrid_free_model = ifumed
hybrid_oh_model = pos3
hybrid_oh_highpass = True
bkg_plane = False
