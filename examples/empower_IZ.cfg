# EMPOWER reduction of KMOS IZ data, full chain from raw frames to sky-subtracted,
# illumination- and background-corrected, barycentric-corrected cubes.
#
#   python scripts/reduce_kmos.py -p examples/empower_IZ.cfg
#   python scripts/apply_telluric_only.py -p examples/empower_IZ.cfg     (adds *_rv_tell.fits)
#
# Run it from an empty working directory: esorex writes temporary .sof files and logs there.
# Needs esorex with the KMOS recipes and $KMOS_CALIB pointing at the KMOS static calibrations.
#
# Settings are those of the October 2026 EMPOWER IZ reduction:
#   - row common-mode correction of detectors 2 and 3
#   - ZAPv2 sky subtraction with the mean-free IZ eigenbasis shipped in pyspark/data
#   - hybrid sky subtraction for OBJECT frames whose SKY frame is > 20 deg away in rotator angle,
#     with the OH-line-wing term (hybrid_wing = 3)
#   - telluric correction as a separate step (telluric_in_sof = False)

[instrument]
# comma-separated for several bands, e.g. IZ,YJ,H
obsband = IZ

[pathing]
# rawdir/<subdir> holds the raw frames of one OB (science, sky, darks, flats, arcs, standard);
# results go to procdir/<subdir>. One subdir per line.
rawdir  = /path/to/kmos_raw
procdir = /path/to/kmos_proc
subdirs = KMOS.2026-01-14T05:23:13.608
          KMOS.2026-01-15T01:00:33.152

[detector]
channel_correct = True
picture_correct = True
interchannel_correct = False
# the detector step writes dc_ frames, the row common-mode step turns them into dcr_ frames
prefix = dcr
row_commonmode_correct = True
row_commonmode_input = dc
row_commonmode_dets = 2,3
row_commonmode_grow = 1
row_commonmode_minpix = 150

[calibration]
# the calibration steps depend on each other, run all of them for a new OB
make_dark = True
make_flat = True
make_arc = True
make_illum = True
reconstruct_arc = True
make_standard = True
darkexp = 300

[cubes]
reconstruct_cubes = True
sky_method = zapv2
# absolute path to the mean-free IZ eigenbasis in this repository
svd_path = /path/to/EMPOWER-Reduction-Pipeline/pyspark/data/ZAPv2_SVD_IZ_n500004_nomean.fits
rvcorr = True
use_oh = True
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
hybrid_sky = True
hybrid_min_dangle = 20
# IFU-wide median of the sky-only term in the OH-line wings (2-3 planes from a line core)
hybrid_wing = 3
